        });

        // 頁面切換 logic
        function switchTab(tab) {
            ['recommendations', 'rankings', 'favorites'].forEach(t => {
                document.getElementById(`page-${t}`).classList.add('hidden');
                
                // 桌機 Nav 樣式
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tab) {
                        btn.className = 'px-5 py-2 rounded-full text-sm font-medium transition-all duration-200 bg-white text-amber-900 shadow-sm';
                    } else {
                        btn.className = 'px-5 py-2 rounded-full text-sm font-medium transition-all duration-200 text-gray-600 hover:text-amber-900';
                    }
                }
                
                // 手機 Nav 樣式
                const mBtn = document.getElementById(`m-nav-${t}`);
                if (mBtn) {
                    mBtn.className = t === tab ? 'flex flex-col items-center py-1 text-xs text-amber-800 font-bold' : 'flex flex-col items-center py-1 text-xs text-gray-500';
                }
            });

            document.getElementById(`page-${tab}`).classList.remove('hidden');
            if (tab === 'favorites') renderFavorites();
        }

        // 渲染情境推薦
        function renderRecommendations() {
            const container = document.getElementById('recommendation-cards');
            const filtered = booksData.filter(b => currentTiming === 'all' || b.bestTiming === currentTiming);
            
            container.innerHTML = filtered.map(book => `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-amber-900/5 hover:shadow-xl hover:-translate-y-1 transition duration-300 flex flex-col justify-between">
                    <div>
                        <!-- 封面與時機標籤 -->
                        <div class="relative h-64 bg-amber-50 overflow-hidden flex items-center justify-center p-4">
                            <img src="${book.cover}" alt="${book.title}" class="h-full object-contain shadow-md rounded-lg transform hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/400x600/342413/ffffff?text=${encodeURIComponent(book.title)}'">
                            <span class="absolute top-4 left-4 bg-amber-950/80 backdrop-blur-md text-amber-100 text-xs px-3 py-1 rounded-full font-medium shadow">
                                ${book.timingBadge}
                            </span>
                        </div>
                        
                        <!-- 內容介紹 -->
                        <div class="p-6">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-serif font-bold text-xl text-amber-950">${book.title}</h3>
                                <button onclick="toggleFavorite('${book.id}')" class="text-gray-400 hover:text-red-500 transition ml-2">
                                    <i class="${favorites.includes(book.id) ? 'fa-solid text-red-500' : 'fa-regular'} fa-bookmark text-lg"></i>
                                </button>
                            </div>
                            <p class="text-xs font-semibold text-amber-700 mb-3">作者：${book.author} · ${book.categoryName}</p>
                            
                            <!-- 為什麼要看 -->
                            <div class="bg-amber-50/70 p-3.5 rounded-2xl mb-4 border border-amber-100">
                                <h4 class="text-xs font-bold text-amber-900 mb-1 flex items-center">
                                    <i class="fa-solid fa-lightbulb text-amber-600 mr-1.5"></i>為何值得觀看？
                                </h4>
                                <p class="text-xs text-gray-700 leading-relaxed line-clamp-3">${book.whyRead}</p>
                            </div>
                        </div>
                    </div>

                    <!-- 底部按鈕 -->
                    <div class="px-6 pb-6 pt-0">
                        <button onclick="openModal('${book.id}')" class="w-full py-2.5 bg-amber-100/60 hover:bg-amber-800 hover:text-white text-amber-900 text-xs font-bold rounded-xl transition duration-200 flex items-center justify-center space-x-1">
                            <span>完整解析與佳句導讀</span>
                            <i class="fa-solid fa-arrow-right text-[10px]"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 渲染排行榜
        function renderRankings() {
            const container = document.getElementById('rankings-list');
            
            // 排序與過濾
            let list = [...booksData].sort((a, b) => (a.storeRanks[currentStore] || 99) - (b.storeRanks[currentStore] || 99));
            if (currentCat !== 'all') {
                list = list.filter(b => b.category === currentCat);
            }

            container.innerHTML = list.map(book => {
                const rank = book.storeRanks[currentStore];
                let rankBadge = `<span class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 font-bold text-sm flex items-center justify-center">${rank}</span>`;
                if (rank === 1) rankBadge = `<span class="w-8 h-8 rounded-full bg-amber-500 text-white font-bold text-sm flex items-center justify-center shadow-md shadow-amber-500/30">1</span>`;
                if (rank === 2) rankBadge = `<span class="w-8 h-8 rounded-full bg-slate-400 text-white font-bold text-sm flex items-center justify-center shadow-md">2</span>`;
                if (rank === 3) rankBadge = `<span class="w-8 h-8 rounded-full bg-amber-700 text-white font-bold text-sm flex items-center justify-center shadow-md">3</span>`;

                return `
                    <div class="flex items-center justify-between p-4 rounded-2xl hover:bg-amber-50/50 transition border-b border-gray-100 last:border-0">
                        <div class="flex items-center space-x-4">
                            ${rankBadge}
                            <img src="${book.cover}" class="w-12 h-16 object-cover rounded shadow-sm" alt="${book.title}" onerror="this.src='https://placehold.co/400x600/342413/ffffff?text=Book'">
                            <div>
                                <h4 class="font-serif font-bold text-base text-amber-950">${book.title}</h4>
                                <p class="text-xs text-gray-500 mt-0.5">${book.author} · <span class="text-amber-800">${book.categoryName}</span></p>
                                <span class="inline-block mt-1 text-[10px] px-2 py-0.5 bg-amber-100/60 text-amber-800 rounded-md">${book.timingBadge}</span>
                            </div>
                        </div>

                        <div class="flex items-center space-x-2">
                            <button onclick="openModal('${book.id}')" class="px-3 py-1.5 text-xs bg-amber-900 text-white rounded-lg hover:bg-amber-800 transition">詳細說明</button>
                            <button onclick="toggleFavorite('${book.id}')" class="p-2 text-gray-400 hover:text-red-500 transition">
                                <i class="${favorites.includes(book.id) ? 'fa-solid text-red-500' : 'fa-regular'} fa-bookmark"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染收藏頁面
        function renderFavorites() {
            const container = document.getElementById('favorites-list');
            const favBooks = booksData.filter(b => favorites.includes(b.id));

            if (favBooks.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center">
                        <i class="fa-regular fa-bookmark text-5xl text-gray-300 mb-3 block"></i>
                        <p class="text-gray-500 font-medium">您的願望清單目前還是空的</p>
                        <p class="text-xs text-gray-400 mt-1">點選書籍右上方書籤圖示即可加入收藏</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = favBooks.map(book => `
                <div class="bg-white rounded-2xl p-5 border border-amber-900/5 shadow-sm flex space-x-4 relative">
                    <img src="${book.cover}" class="w-20 h-28 object-cover rounded-lg shadow" alt="${book.title}">
                    <div class="flex flex-col justify-between flex-grow">
                        <div>
                            <h3 class="font-serif font-bold text-lg text-amber-950">${book.title}</h3>
                            <p class="text-xs text-gray-500">${book.author}</p>
                            <span class="inline-block mt-2 text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded">${book.timingBadge}</span>
                        </div>
                        <div class="flex justify-between items-center mt-3">
                            <button onclick="openModal('${book.id}')" class="text-xs text-amber-700 font-bold underline">查看細節</button>
                            <button onclick="toggleFavorite('${book.id}')" class="text-xs text-red-500 font-medium">移除收藏</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 切換書店排行榜
        function switchStore(store) {
            currentStore = store;
            document.querySelectorAll('.store-btn').forEach(btn => {
                btn.className = 'store-btn px-4 py-2 rounded-xl text-sm font-semibold text-gray-600 hover:text-amber-900 transition';
            });
            const activeBtn = document.getElementById(`store-${store}`);
            activeBtn.className = 'store-btn px-4 py-2 rounded-xl text-sm font-semibold transition bg-white text-amber-900 shadow-sm';
            renderRankings();
        }

        // 依據類別過濾排行榜
        function filterCategory(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-600 hover:bg-amber-100';
            });
            event.target.className = 'cat-btn active flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium bg-amber-900 text-white';
            renderRankings();
        }

        // 依據時機過濾推薦
        function filterTiming(timing) {
            currentTiming = timing;
            document.querySelectorAll('.timing-btn').forEach(btn => {
                btn.className = 'timing-btn px-4 py-2 rounded-full bg-stone-100 hover:bg-amber-100 text-stone-700 font-medium transition';
            });
            event.target.className = 'timing-btn active px-4 py-2 rounded-full bg-amber-800 text-white shadow-sm font-medium transition';
            renderRecommendations();
        }

        // 搜尋邏輯
        function handleSearch(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                renderRecommendations();
                return;
            }

            const container = document.getElementById('recommendation-cards');
            const matched = booksData.filter(b => 
                b.title.toLowerCase().includes(q) || 
                b.author.toLowerCase().includes(q) || 
                b.whyRead.toLowerCase().includes(q)
            );

            if (matched.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">找不到與「${query}」相關的書籍推薦</div>`;
                return;
            }

            container.innerHTML = matched.map(book => `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-amber-900/5 p-6">
                    <h3 class="font-serif font-bold text-xl text-amber-950">${book.title}</h3>
                    <p class="text-xs text-amber-700 mb-2">${book.author}</p>
                    <p class="text-xs text-gray-600 mb-4">${book.whyRead}</p>
                    <button onclick="openModal('${book.id}')" class="px-4 py-2 bg-amber-800 text-white text-xs rounded-xl">查看導讀</button>
                </div>
            `).join('');
        }

        // 開啟 Modal
        function openModal(id) {
            const book = booksData.find(b => b.id === id);
            if (!book) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="flex flex-col md:flex-row gap-6">
                    <img src="${book.cover}" class="w-40 h-60 object-cover rounded-2xl shadow-lg mx-auto md:mx-0" alt="${book.title}">
                    <div class="space-y-4 flex-grow">
                        <div>
                            <span class="text-xs font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-full">${book.categoryName}</span>
                            <h2 class="text-2xl font-serif font-bold text-amber-950 mt-2">${book.title}</h2>
                            <p class="text-sm text-gray-500">作者：${book.author}</p>
                        </div>

                        <!-- 最佳觀看時機 -->
                        <div class="bg-stone-50 p-3.5 rounded-2xl border border-stone-200">
                            <h4 class="text-xs font-bold text-amber-900 mb-1">⏰ 最佳觀看時機與場合</h4>
                            <p class="text-xs text-stone-700">${book.timingDesc}</p>
                        </div>

                        <!-- 書中金句 -->
                        <div class="border-l-4 border-amber-600 pl-4 py-1 italic text-gray-600 text-sm">
                            ${book.quote}
                        </div>
                    </div>
                </div>

                <div class="mt-6 pt-6 border-t border-gray-100 space-y-4">
                    <div>
                        <h3 class="font-serif font-bold text-base text-amber-950 mb-2">💡 深入解析：這本書為何值得一讀？</h3>
                        <p class="text-sm text-gray-700 leading-relaxed">${book.whyRead}</p>
                    </div>

                    <div>
                        <h3 class="font-serif font-bold text-base text-amber-950 mb-2">📊 連鎖書店最新暢銷排名</h3>
                        <div class="grid grid-cols-3 gap-2 text-center text-xs">
                            <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-100">
                                <span class="text-gray-500 block text-[10px]">誠品書店</span>
                                <span class="font-bold text-amber-900 text-sm">第 ${book.storeRanks.eslite} 名</span>
                            </div>
                            <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-100">
                                <span class="text-gray-500 block text-[10px]">博客來</span>
                                <span class="font-bold text-amber-900 text-sm">第 ${book.storeRanks.books} 名</span>
                            </div>
                            <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-100">
                                <span class="text-gray-500 block text-[10px]">金石堂</span>
                                <span class="font-bold text-amber-900 text-sm">第 ${book.storeRanks.kingstone} 名</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('bookModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('bookModal').classList.add('hidden');
        }

        // 收藏與取消收藏
        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('book_favs', JSON.stringify(favorites));
            updateFavCount();
            renderRecommendations();
            renderRankings();
            if (!document.getElementById('page-favorites').classList.contains('hidden')) {
                renderFavorites();
            }
        }

        function updateFavCount() {
            document.getElementById('fav-count').innerText = favorites.length;
            const badge = document.getElementById('m-fav-badge');
            if (favorites.length > 0) {
                badge.innerText = favorites.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
